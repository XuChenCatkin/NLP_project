[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-project-xc"
version = "0.1.0"
description = "NLP pipelines (embedding, retrieval, NER, QA, QG)"
authors = [{name="Chen Xu"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "transformers>=4.41",
  "torch",
  "faiss-cpu; platform_system != 'Windows'",
  "numpy",
  "pandas",
  "scikit-learn",
  "tqdm",
  "pyyaml",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
  "mypy",
  "pre-commit",
]

[project.scripts]
"nlp-project" = "nlp_project.cli:app"

[tool.ruff]
line-length = 100
lint.select = ["E","F","I","W","B","UP","ARG"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
ignore_missing_imports = true
