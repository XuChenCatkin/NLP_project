name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          pip install -U pip
          pip install -e .[dev]
      - name: Lint & Typecheck
        run: |
          ruff check .
          ruff format --check .
          mypy src/nlp_project || true
      - name: Tests
        run: pytest -q
